server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Arquivos gerados pelo Vite recebem nomes com hash e podem ficar em cache por um ano.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Mantém as rotas do React funcionando em acessos diretos, por exemplo /checkout/<id>.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
